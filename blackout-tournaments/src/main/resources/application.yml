server:
  port: ${SERVER_PORT:8082}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: 3
  application:
    name: blackout-tournaments
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:tournaments_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:blackout}
    password: ${RABBITMQ_PASSWORD:blackout-local}
app:
  scoreboard:
    url: ${SCOREBOARD_URL:http://localhost:8087}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
  security:
    entra-issuer: ${ENTRA_ISSUER:}
    entra-audience: ${ENTRA_AUDIENCE:}
    entra-scope: ${ENTRA_SCOPE:access_as_user}
    cognito-issuer: ${COGNITO_ISSUER:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}
  rabbit:
    enabled: ${RABBITMQ_ENABLED:true}
    events-exchange: blackout.events.exchange
    dead-letter-exchange: blackout.dead-letter.exchange
    queues:
      fan-notifications: fan.notifications.queue
      fan-notifications-dlq: fan.notifications.dlq
    routing:
      fan-notifications: tournament.#
      fan-notifications-dlq: fan.notifications.failed
      tournament-created: tournament.created
    max-retries: 3
springdoc:
  swagger-ui:
    path: /swagger-ui.html
