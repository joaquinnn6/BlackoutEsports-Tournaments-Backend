services:
  tournaments-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tournaments_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - tournaments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  tournaments-service:
    build: ./blackout-tournaments
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      SCOREBOARD_URL: http://scoreboard:8087
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      DB_HOST: tournaments-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tournaments_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001}
      ENTRA_ISSUER: ${ENTRA_ISSUER}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-access_as_user}
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-blackout-rabbitmq:5672}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-blackout-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-blackout}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    depends_on:
      tournaments-db:
        condition: service_healthy
    networks:
      - default
      - blackout-network
volumes:
  tournaments_db_data:
networks:
  blackout-network:
    external: true
    name: blackout-network
