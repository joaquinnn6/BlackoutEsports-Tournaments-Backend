services:
  zk1:
    image: confluentinc/cp-zookeeper:7.7.13
    hostname: zk1
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log
    networks: [blackout-network]
  zk2:
    image: confluentinc/cp-zookeeper:7.7.13
    hostname: zk2
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log
    networks: [blackout-network]
  zk3:
    image: confluentinc/cp-zookeeper:7.7.13
    hostname: zk3
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log
    networks: [blackout-network]
  kafka1:
    image: confluentinc/cp-kafka:7.7.13
    hostname: kafka1
    ports: ["127.0.0.1:19091:19091"]
    restart: unless-stopped
    depends_on: [zk1, zk2, zk3]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19091
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,OUTSIDE://localhost:19091
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks: [blackout-network]
  kafka2:
    image: confluentinc/cp-kafka:7.7.13
    hostname: kafka2
    ports: ["127.0.0.1:19092:19092"]
    restart: unless-stopped
    depends_on: [zk1, zk2, zk3]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,OUTSIDE://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks: [blackout-network]
  kafka3:
    image: confluentinc/cp-kafka:7.7.13
    hostname: kafka3
    ports: ["127.0.0.1:19093:19093"]
    restart: unless-stopped
    depends_on: [zk1, zk2, zk3]
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,OUTSIDE://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks: [blackout-network]
  scoreboard-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoreboard_db
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: ${SCOREBOARD_DB_PASSWORD:?Define SCOREBOARD_DB_PASSWORD}
    volumes: ["scoreboard-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard -d scoreboard_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [blackout-network]
  scoreboard:
    build: ./scoreboard
    restart: unless-stopped
    ports: ["127.0.0.1:8087:8087"]
    environment:
      DB_HOST: scoreboard-db
      DB_PORT: 5432
      DB_NAME: scoreboard_db
      DB_USER: scoreboard
      DB_PASSWORD: ${SCOREBOARD_DB_PASSWORD:?Define SCOREBOARD_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    depends_on:
      scoreboard-db: {condition: service_healthy}
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/api/matches"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [blackout-network]
  kafka-admin:
    build: ./kafka-admin
    restart: unless-stopped
    ports: ["127.0.0.1:8086:8086"]
    environment:
      ENTRA_ISSUER: ${ENTRA_ISSUER}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-PanelAdministrativo}
    networks: [blackout-network]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: blackout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    networks: [blackout-network]
networks:
  blackout-network:
    external: true
volumes:
  scoreboard-data:
  zk1-data:
  zk1-log:
  kafka1-data:
  zk2-data:
  zk2-log:
  kafka2-data:
  zk3-data:
  zk3-log:
  kafka3-data:
