name: Verify tournaments service
on:
  push:
    branches: [main, develop, "feature-*"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SCOREBOARD_DB_PASSWORD: ci-only-scoreboard-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp -f blackout-tournaments/pom.xml clean verify
      - name: Probar servicio independiente de marcadores
        run: mvn -B -ntp -f scoreboard/pom.xml verify
      - name: Validate Compose
        run: docker compose config --quiet
        env:
          RABBITMQ_PASSWORD: ci-only-password

      - name: Compilar administrador Kafka
        run: mvn -B -ntp -f kafka-admin/pom.xml verify
      - name: Levantar tres ZooKeeper y tres brokers
        run: |
          docker network create blackout-network
          docker compose -f docker-compose.kafka.yml up -d --wait --wait-timeout 240 zk1 zk2 zk3 kafka1 kafka2 kafka3
      - name: Levantar marcador con PostgreSQL independiente
        run: docker compose -f docker-compose.kafka.yml up -d --build --wait --wait-timeout 240 scoreboard
      - name: Probar flujo real entre ambos tópicos
        run: mvn -B -ntp -f blackout-tournaments/pom.xml -Dtest=KafkaClusterTests -Dkafka.integration=true test
      - name: Probar con un broker detenido
        run: |
          docker compose -f docker-compose.kafka.yml stop kafka3
          mvn -B -ntp -f blackout-tournaments/pom.xml -Dtest=KafkaClusterTests -Dkafka.integration=true test
      - name: Recuperar broker
        if: always()
        run: docker compose -f docker-compose.kafka.yml up -d --wait --wait-timeout 180 kafka3
      - name: Registrar estado del clúster
        if: always()
        run: docker compose -f docker-compose.kafka.yml logs --tail=30
      - name: Detener clúster de pruebas
        if: always()
        run: docker compose -f docker-compose.kafka.yml down -v
